<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>퀴즈 마스터</title><link rel="stylesheet" href="style.css"><script src="questions.js" defer></script><script src="script.js" defer></script></head>
<body><main class="container"><header class="page-header"><div class="logo">QM</div><h1>퀴즈 마스터</h1><p>통합과학2 · 통합사회2 · 한국사2</p></header>
<section id="startScreen" class="card"><h2>퀴즈 도전하기</h2><p class="description">총 15문제 · 문제당 10점</p><label for="playerName">이름 또는 별명</label><input id="playerName" maxlength="20" autocomplete="off" placeholder="이름 또는 별명 입력"><p id="nameError" class="error" aria-live="polite"></p><button id="startBtn" class="btn primary">게임 시작 →</button></section>
<section id="quizScreen" class="card hidden"><div class="quiz-top"><span id="questionNumber"></span><span id="currentScore" class="score">0점</span></div><div class="progress-track" role="progressbar" aria-label="퀴즈 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progressBar" class="progress-fill"></div></div><span id="categoryBadge" class="category"></span><h2 id="questionText" class="question-title"></h2><div id="optionsContainer" class="options"></div><div id="feedback" class="feedback hidden" role="status" aria-live="polite"><h3 id="feedbackTitle"></h3><p id="explanationText"></p></div><button id="nextBtn" class="btn primary hidden">다음 문제 →</button></section>
<section id="resultScreen" class="card hidden"><div class="result-icon">★</div><h2>퀴즈 완료!</h2><p id="resultName"></p><div class="final-score"><span id="finalScore">0</span><small>점</small></div><div class="stats-grid"><div class="stat-box"><span>정답 수</span><strong id="finalCorrect"></strong></div><div class="stat-box"><span>정답률</span><strong id="finalAccuracy"></strong></div></div><h3 class="section-title">카테고리별 결과</h3><div id="categoryResults"></div><p id="saveStatus" class="notice" role="status"></p><button id="restartBtn" class="btn primary">다시 시작 ↻</button></section>
<footer><a href="admin-report.html">관리자용 보고서 보기 →</a><p>Quiz Master · Educational Project</p></footer></main></body></html>
